<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Extension API Test</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }
        button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            margin: 5px;
        }
        button:hover {
            background: #1d4ed8;
        }
        .result {
            margin-top: 20px;
            padding: 15px;
            background: #f3f4f6;
            border-radius: 6px;
            font-family: monospace;
            white-space: pre-wrap;
            max-height: 400px;
            overflow-y: auto;
        }
        .success {
            background: #d1fae5;
            border: 1px solid #6ee7b7;
        }
        .error {
            background: #fee2e2;
            border: 1px solid #fca5a5;
        }
    </style>
</head>
<body>
    <h1>🧪 Extension API Test</h1>
    <p>Test if the extension can communicate with the API on port 3003</p>
    
    <div>
        <button onclick="testHealth()">Test Health Endpoint</button>
        <button onclick="testSummarize()">Test Summarize</button>
        <button onclick="testProjects()">Test Projects</button>
        <button onclick="testAll()">Test All</button>
    </div>
    
    <div id="result" class="result"></div>

    <script>
        const API_BASE = 'http://localhost:3003';
        const resultDiv = document.getElementById('result');
        
        function log(message, isError = false) {
            resultDiv.textContent += message + '\n';
            resultDiv.className = isError ? 'result error' : 'result success';
        }
        
        function clear() {
            resultDiv.textContent = '';
            resultDiv.className = 'result';
        }
        
        async function testHealth() {
            clear();
            log('Testing Health Endpoint...\n');
            
            try {
                const response = await fetch(`${API_BASE}/api/health`, {
                    method: 'GET',
                    mode: 'cors',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });
                
                log(`Status: ${response.status} ${response.statusText}`);
                
                if (response.ok) {
                    const data = await response.json();
                    log(`✅ Health Check Passed\n${JSON.stringify(data, null, 2)}`);
                } else {
                    log(`❌ Health Check Failed`, true);
                }
            } catch (error) {
                log(`❌ Error: ${error.message}`, true);
            }
        }
        
        async function testSummarize() {
            clear();
            log('Testing Summarize Endpoint...\n');
            
            try {
                const payload = {
                    videoUrl: 'https://www.youtube.com/watch?v=dQw4w9WgXcQ',
                    userEmail: 'test@example.com',
                    settings: {
                        learningMode: 'student',
                        summaryDepth: 'quick',
                        includeTimestamps: false,
                        includeActionItems: true,
                        includeQuiz: false,
                        includeTranscript: false,
                        includeEmojis: false,
                        customPrompt: ''
                    }
                };
                
                log(`Sending: ${JSON.stringify(payload, null, 2)}\n`);
                
                const response = await fetch(`${API_BASE}/api/summarize`, {
                    method: 'POST',
                    mode: 'cors',
                    headers: {
                        'Content-Type': 'application/json',
                        'x-user-tier': 'free',
                        'x-user-email': 'test@example.com'
                    },
                    body: JSON.stringify(payload)
                });
                
                log(`Status: ${response.status} ${response.statusText}\n`);
                
                if (response.ok) {
                    const data = await response.json();
                    if (data.success) {
                        log(`✅ Summary Generated Successfully!\n`);
                        log(`Title: ${data.data.title}`);
                        log(`Main Takeaway: ${data.data.mainTakeaway}`);
                        log(`Summary Length: ${data.data.summary.length} chars`);
                    } else {
                        log(`❌ API returned error: ${data.error}`, true);
                    }
                } else {
                    const errorText = await response.text();
                    log(`❌ Request Failed: ${errorText}`, true);
                }
            } catch (error) {
                log(`❌ Error: ${error.message}`, true);
            }
        }
        
        async function testProjects() {
            clear();
            log('Testing Projects Endpoint...\n');
            
            try {
                const response = await fetch(`${API_BASE}/api/projects?type=projects`, {
                    method: 'GET',
                    mode: 'cors',
                    headers: {
                        'Content-Type': 'application/json',
                        'x-user-email': 'test@example.com'
                    }
                });
                
                log(`Status: ${response.status} ${response.statusText}`);
                
                if (response.ok) {
                    const data = await response.json();
                    log(`✅ Projects Loaded\n${JSON.stringify(data, null, 2)}`);
                } else {
                    log(`❌ Projects Failed`, true);
                }
            } catch (error) {
                log(`❌ Error: ${error.message}`, true);
            }
        }
        
        async function testAll() {
            clear();
            log('Running All Tests...\n');
            log('=' .repeat(50) + '\n');
            
            // Test 1: Health
            log('1. Health Check:');
            try {
                const response = await fetch(`${API_BASE}/api/health`);
                log(response.ok ? '   ✅ Passed' : '   ❌ Failed');
            } catch (e) {
                log('   ❌ Failed: ' + e.message);
            }
            
            // Test 2: Projects  
            log('\n2. Projects API:');
            try {
                const response = await fetch(`${API_BASE}/api/projects?type=projects`, {
                    headers: { 'x-user-email': 'test@example.com' }
                });
                log(response.ok ? '   ✅ Passed' : '   ❌ Failed');
            } catch (e) {
                log('   ❌ Failed: ' + e.message);
            }
            
            // Test 3: Summarize
            log('\n3. Summarize API:');
            try {
                const response = await fetch(`${API_BASE}/api/summarize`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'x-user-email': 'test@example.com'
                    },
                    body: JSON.stringify({
                        videoUrl: 'https://www.youtube.com/watch?v=dQw4w9WgXcQ',
                        settings: { summaryDepth: 'quick' }
                    })
                });
                const data = await response.json();
                log(data.success ? '   ✅ Passed' : '   ❌ Failed');
            } catch (e) {
                log('   ❌ Failed: ' + e.message);
            }
            
            log('\n' + '=' .repeat(50));
            log('Tests Complete!');
        }
        
        // Run health check on load
        window.addEventListener('load', testHealth);
    </script>
</body>
</html>
